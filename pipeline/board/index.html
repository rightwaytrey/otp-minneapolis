        h += liveCycles().map((c) => { const hint = cycleHint(c); return `<button class="it sub" aria-current="${inCycles && cur && cur.id === c.id && ui.cycle !== "new" && ui.cycle !== "retired"}" data-sec="cycles" data-cycle="${esc(c.id)}"><span class="dot" data-s="${hint.tone}"></span>Cycle ${esc(c.number)}<span class="hint" title="${esc(hint.text)}">${esc(hint.text)}</span></button>`; }).join("");
        if (retiredCycles().length) h += `<button class="it sub" aria-current="${inCycles && ui.cycle === "retired"}" data-sec="cycles" data-cycle="retired"><span class="dot" data-s="done"></span>Retired<span class="hint">${retiredCycles().length}</span></button>`;
        h += `<button class="it sub new" aria-current="${inCycles && ui.cycle === "new"}" data-sec="cycles" data-cycle="new">+ Open cycle ${nextNumber()}</button>`;
      }
      return h;
    }).join("");
    return `<div class="brand">TransitNav Pipeline</div><div class="live"><span class="dot" data-s="${lv.s}"></span><span title="${esc(lv.text)}">${esc(lv.text)}</span></div>${PV.switchHtml("pv-sb")}${items}<div class="foot">${sysHtml(true)}</div>`;
  }
  function phoneHeadHtml(a, run) {
    const lv = liveState(run);
    const secLabel = (SECS.find((s) => s[0] === ui.sec) || SECS[0])[1];
    if (ui.sec !== "cycles") return `<div class="eyebrow"><span class="dot" data-s="${lv.s}"></span><span>${esc(lv.text)}</span></div><h2>${secLabel}</h2>`;
    const cur = currentCycle();
    const chips = `<div class="cyc-row">${liveCycles().map((c) => `<button class="cp" aria-current="${cur && cur.id === c.id && ui.cycle !== "new" && ui.cycle !== "retired"}" data-sec="cycles" data-cycle="${esc(c.id)}"><span class="dot" data-s="${cycleHint(c).tone}"></span><b>${esc(c.number)}</b></button>`).join("")}${retiredCycles().length ? `<button class="cp dim" aria-current="${ui.cycle === "retired"}" data-sec="cycles" data-cycle="retired">Retired <span class="h">${retiredCycles().length}</span></button>` : ""}<button class="cp new" aria-current="${ui.cycle === "new"}" data-sec="cycles" data-cycle="new">+ ${nextNumber()}</button></div>`;

  }

  // ---- top-level render -------------------------------------------------
  function render() {
    if (!PV.shown("classic")) return; // hidden view: render on show
    if (!SECS.some((s) => s[0] === ui.sec)) ui.sec = "flow";
    const a = attention(); const run = runningNow();
    $("sb").innerHTML = sidebarHtml(a, run);
    $("phead").innerHTML = PV.switchHtml("pv-ph") + phoneHeadHtml(a, run);
    $("bbar").innerHTML = bottomBarHtml(a, run);
    const focused = document.activeElement && document.activeElement.tagName === "TEXTAREA" ? document.activeElement.id : null;
    const R = { flow: renderFlow, triage: renderTriage, cycles: renderCycles, log: renderLog };
    $("main").innerHTML = (connected ? "" : `<div class="offline">This page can't reach its board from here. Open it inside claude.ai to press anything.</div>`) + (R[ui.sec] || renderFlow)();
    renderDrawer();
    if (focused) { const el = $(focused); if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (_) {} } }
  }

  let toastTimer;
  function toast(msg, ms) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms || 4500); }

  // ---- events -----------------------------------------------------------
  ROOT.addEventListener("input", (e) => { const el = e.target; if (el.tagName === "TEXTAREA" && el.id) drafts[el.id] = el.value; });
  ROOT.addEventListener("change", (e) => { if (e.target.id === "intake-then-plan") { ui.thenPlan = e.target.checked; saveUi(); } });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && ui.item && PV.shown("classic")) { ui.item = null; saveUi(); renderDrawer(); } });
  ROOT.addEventListener("click", (e) => {
    if (e.target.id === "scrim") { ui.item = null; saveUi(); return renderDrawer(); }
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.close) { ui.item = null; saveUi(); return renderDrawer(); }
    if (t.dataset.decide) return decideBranch(t.dataset.cycle, t.dataset.branch, t.dataset.decide, t);
    if (t.dataset.keep !== undefined) return setKeep(t.dataset.cycle, t.dataset.row, t.dataset.keep === "1", t);
    if (t.dataset.planfb) return sendPlanFeedback(t.dataset.planfb, t);
    if (t.dataset.planapprove) return approvePlan(t.dataset.planapprove, t);
    if (t.dataset.sec) return goto(t.dataset.sec, t.dataset.cycle, t.dataset.stage);
    if (t.dataset.tfilter) { ui.tfilter = t.dataset.tfilter; saveUi(); return render(); }
    if (t.dataset.filter) { ui.filter = t.dataset.filter; ui.sec = "flow"; saveUi(); return render(); }
    if (t.dataset.item) { ui.item = t.dataset.item; saveUi(); return renderDrawer(); }
    if (t.dataset.startIntake) return requestIntake(t);
    if (t.dataset.cancelIntake) return cancelIntake();
    if (t.id === "newcycle") return newCycle(t);
    if (t.dataset.start) return requestStep(t.dataset.start, t.dataset.step, t);
    if (t.dataset.cancel) return cancelStep(t.dataset.cancel, t.dataset.step);
    if (t.dataset.answers) return sendAnswers(t.dataset.answers, t);
  });

  // ---- writes -----------------------------------------------------------
  const clone = (o) => JSON.parse(JSON.stringify(o));
  function appendLog(b, entry) { b.log = (b.log || []).concat([entry]).slice(-80); }
  async function readDoc(path) { const ref = db.doc(path); const s = await ref.get(); return { ref, data: s.exists ? clone(s.data()) : null }; }
  async function logBoard(entry) { const { ref, data } = await readDoc(BOARD); const b = data || {}; appendLog(b, entry); b.updatedAt = Date.now(); await ref.set(b); }

  async function wake(anchorEl, text) {
    if (!comments) return { ok: false, why: "comments aren't available in this view" };
    try {
      const can = await comments.canSendToClaude();
      if (can !== "available") return { ok: false, why: can === "no_session" ? "no Claude session is watching the board" : can === "writers_only" ? "this account can't send to Claude here" : "sending to Claude is off here" };
      const anchor = await comments.anchorFor(anchorEl || $("main"));
      await comments.sendToClaude({ anchor, text });
      return { ok: true };
    } catch (err) { return { ok: false, why: err && err.code === "consent_required" ? "you didn't allow the page to comment" : (err && err.code) || "the send failed" }; }
  }
  const noDb = () => { toast("No board connection. Open this page inside claude.ai."); return false; };

  async function requestIntake(btn) {
    if (!db) return noDb();
    const note = (drafts["note-intake"] || "").trim(); const now = Date.now(); btn.disabled = true;
    try {
      const { ref, data } = await readDoc(BOARD); const b = data || {};
      b.intake = Object.assign({}, b.intake || {}, { status: "requested", requestedAt: now, startedAt: null, finishedAt: null, note, requestedBy: uid || null, wake: null, thenPlan: false });
      appendLog(b, { t: now, stage: "triage", event: "requested", text: (note ? note + " · " : "") + (false ? "then plan cycle " + nextNumber() : "triage only") }); b.updatedAt = now; await ref.set(b); drafts["note-intake"] = "";
    } catch (err) { btn.disabled = false; return toast("Couldn't write the request (" + (err && err.code || "error") + "). Nothing was queued."); }
    const r = await wake($("main"), `START triage` + (false ? ` — then plan cycle ${nextNumber()}` : "") + (note ? `\n\n${note}` : "") + `\n\nRun the transitnav-pipeline skill for stage "triage", update pipeline/board.intake` + (false ? `, then open cycles/c${nextNumber()} with the rows triage opened or touched and run stage "plan" on it` : "") + `, and reply here when it is done.`);
    try { const { ref, data } = await readDoc(BOARD); if (data && data.intake) { data.intake.wake = { ok: r.ok, at: Date.now(), why: r.why || "" }; await ref.set(data); } } catch (_) {}
    toast(r.ok ? (false ? "Sent to Claude. Triage is queued; a plan follows." : "Sent to Claude. Triage is queued.") : `Queued on the board, but ${r.why}.`, r.ok ? 4000 : 7000);
  }
  async function cancelIntake() {
    if (!db) return noDb(); const now = Date.now();
    try { const { ref, data } = await readDoc(BOARD); if (!data || !data.intake || data.intake.status !== "requested") return toast("Too late — Claude already picked it up.");
      data.intake = Object.assign({}, data.intake, { status: data.intake.finishedAt ? "done" : "idle", requestedAt: null, note: "", wake: null }); appendLog(data, { t: now, stage: "triage", event: "request cancelled" }); data.updatedAt = now; await ref.set(data); toast("Cancelled.");
    } catch (err) { toast("Couldn't cancel (" + (err && err.code || "error") + ")."); }
  }

  async function newCycle(btn) {
    if (!db) return noDb();
    const note = (drafts["note-newcycle"] || "").trim(); const now = Date.now(); btn.disabled = true;
    const number = nextNumber(); const id = "c" + number;
    try {
      await db.doc("cycles/" + id).set({ id, number, createdAt: now, rows: [], questions: [], branches: [], bundle: {}, steps: { plan: { status: "requested", requestedAt: now, note, requestedBy: uid || null } } });
      await logBoard({ t: now, stage: "cycle " + number, event: "opened", text: note }); drafts["note-newcycle"] = "";
      ui.cycle = id; ui.stage = "plan"; saveUi();
    } catch (err) { btn.disabled = false; return toast("Couldn't open the cycle (" + (err && err.code || "error") + ")."); }
    const r = await wake($("main"), `START plan — cycle ${number}` + (note ? `\n\n${note}` : "") + `\n\nRun the transitnav-pipeline skill for stage "plan" on cycles/${id}, and reply here when the plan is ready to read.`);
    await recordWake([id], "plan", r);
    toast(r.ok ? `Sent to Claude. Cycle ${number} is being planned.` : `Cycle ${number} is open on the board, but ${r.why}.`, r.ok ? 4000 : 7000);
  }

  async function recordWake(ids, key, r) {
    for (const id of ids) { try { const { ref, data } = await readDoc("cycles/" + id); if (data && data.steps && data.steps[key]) { data.steps[key].wake = { ok: r.ok, at: Date.now(), why: r.why || "" }; await ref.set(data); } } catch (_) {} }
  }

  async function requestStep(cid, key, btn) {
    if (!db) return noDb();
    const note = (drafts["note-" + cid + "-" + key] || "").trim(); const now = Date.now(); btn.disabled = true;
    // A press acts on the cycle it was pressed on, never on others (2026-09-24: Verify used to fan out to every cycle on dev).
    const targets = [cid];
    try {
      for (const id of targets) {
        const { ref, data } = await readDoc("cycles/" + id); if (!data) continue;
        data.steps = data.steps || {}; data.steps[key] = Object.assign({}, data.steps[key] || {}, { status: "requested", requestedAt: now, startedAt: null, finishedAt: null, note, requestedBy: uid || null, wake: null });
        await ref.set(data);
      }
      const c0 = cyc(cid); await logBoard({ t: now, stage: "cycle " + (c0 ? c0.number : cid), event: key + " requested", text: note }); drafts["note-" + cid + "-" + key] = "";
    } catch (err) { btn.disabled = false; return toast("Couldn't write the request (" + (err && err.code || "error") + "). Nothing was queued."); }
    const c0 = cyc(cid); const n = c0 ? c0.number : cid;
    const text = key === "verify"
      ? `START verify — cycle ${n} (last ride)` + (note ? `\n\n${note}` : "") + `\n\nRun the transitnav-pipeline skill for stage "verify" on cycles/${cid} ONLY — score this cycle's rows against the last dev ride, touch no other cycle, update it, and reply here when done.`
      : key === "ship-dev"
        ? `START ship-dev — cycle ${n}\nApproved: ${ships(c0 || {}).map((b) => b.name).join(", ") || "(none)"}\nHeld: ${held(c0 || {}).map((b) => b.name).join(", ") || "(none)"}` + (note ? `\n\n${note}` : "") + `\n\nRun the transitnav-pipeline skill for stage "ship-dev" on cycles/${cid}: merge every built branch that is not held, update it, and reply here when it is done.`
        : `START ${key} — cycle ${n}` + (note ? `\n\n${note}` : "") + `\n\nRun the transitnav-pipeline skill for stage "${key}" on cycles/${cid}, update it, and reply here when it is done.`;
    const r = await wake($("card-" + cid + "-" + key) || $("main"), text);
    await recordWake(targets, key, r);
    toast(r.ok ? `Sent to Claude. ${STEP[key].label} is queued.` : `Queued on the board, but ${r.why}.`, r.ok ? 4000 : 7000);
  }
  async function cancelStep(cid, key) {
    if (!db) return noDb(); const now = Date.now();
    const targets = [cid];
    try {
      let any = false;
      for (const id of targets) { const { ref, data } = await readDoc("cycles/" + id); if (!data) continue; const st = (data.steps || {})[key] || {}; if (st.status !== "requested") continue;
        data.steps[key] = Object.assign({}, st, { status: key === "plan" && st.mode === "revise" ? "draft" : st.finishedAt ? "done" : "idle", mode: key === "plan" && st.mode === "revise" ? null : (st.mode || null), requestedAt: null, note: "", wake: null }); await ref.set(data); any = true; }
      if (!any) return toast("Too late — Claude already picked it up.");
      const c = cyc(cid); await logBoard({ t: now, stage: "cycle " + (c ? c.number : cid), event: key + " request cancelled" }); toast("Cancelled.");
    } catch (err) { toast("Couldn't cancel (" + (err && err.code || "error") + ")."); }
  }

  async function sendAnswers(cid, btn) {
    if (!db) return noDb();
    const c0 = cyc(cid); if (!c0) return;
    const answers = unanswered(c0).map((q) => ({ q, a: (drafts["ans-" + cid + "-" + q.id] || "").trim() })).filter((x) => x.a);
    if (!answers.length) return toast("Type an answer first.");
    const now = Date.now(); btn.disabled = true; let inReview = false, rev = 0;
    try {
      const { ref, data } = await readDoc("cycles/" + cid); if (!data) return;
      data.questions = (data.questions || []).map((q) => { const hit = answers.find((x) => x.q.id === q.id); return hit ? Object.assign({}, q, { answer: hit.a, answeredAt: now }) : q; });
      if (((data.steps || {}).plan || {}).status === "draft") { inReview = true; rev = (data.plan && data.plan.revision) || 0; data.steps.plan = Object.assign({}, data.steps.plan, { status: "requested", mode: "revise", requestedAt: now, startedAt: null, finishedAt: null, requestedBy: uid || null, wake: null }); }
      await ref.set(data);
      await logBoard({ t: now, stage: "cycle " + (c0.number || cid), event: "answers", text: answers.map((x) => x.q.id.toUpperCase() + ": " + x.a).join(" · ") });
      answers.forEach((x) => { drafts["ans-" + cid + "-" + x.q.id] = ""; });
    } catch (err) { btn.disabled = false; return toast("Couldn't save the answers (" + (err && err.code || "error") + ")."); }
    const r = await wake($("main"), `ANSWERS — cycle ${c0.number}\n` + answers.map((x) => `${x.q.id.toUpperCase()} (${(x.q.rows || []).join(", ")}): ${x.a}`).join("\n") + (inReview ? `\n\nThe plan is in review (revision ${rev}): record these answers on their rows and post the next plan revision, then reply here with what changed.` : `\n\nRecord these on the rows they affect; if Build is running for this cycle, add the unblocked rows to it.`));
    if (inReview) await recordWake([cid], "plan", r);
    toast(r.ok ? "Answers saved and sent to Claude." : `Answers saved on the board, but ${r.why}. They are read at the next step.`, r.ok ? 4000 : 7000);
  }

  async function decideBranch(cid, name, decision, btn) {
    if (!db) return noDb();
    const now = Date.now(); btn.disabled = true;
    try {
      const { ref, data } = await readDoc("cycles/" + cid); if (!data) return;
      let hit = false;
      data.branches = (data.branches || []).map((b) => { if (b && typeof b === "object" && b.name === name) { hit = true; return Object.assign({}, b, { decision, decidedAt: now, decidedBy: uid || null }); } return b; });
      if (!hit) return toast("That branch is no longer on the cycle.");
      await ref.set(data);
      await logBoard({ t: now, stage: "cycle " + (data.number || cid), event: decision === "approve" ? "set to ship" : "held", text: name });
      toast(decision === "approve" ? `${name} ships to dev on its own.` : `Held: ${name}. Ship dev leaves it out.`);
    } catch (err) { btn.disabled = false; toast("Couldn't save the decision (" + (err && err.code || "error") + ")."); }
  }

  // ---- plan review ------------------------------------------------------
  async function setKeep(cid, rowNum, keep, btn) {
    if (!db) return noDb();
    const now = Date.now(); btn.disabled = true;
    try {
      const { ref, data } = await readDoc("cycles/" + cid); if (!data) return;
      let hit = false;
      data.rows = (data.rows || []).map((r) => { if (r && r.num === rowNum) { hit = true; return Object.assign({}, r, { keep }); } return r; });
      if (!hit) { btn.disabled = false; return toast("That row is no longer on the cycle."); }
      await ref.set(data);
      await logBoard({ t: now, stage: "cycle " + (data.number || cid), event: keep ? "row kept" : "row dropped", text: rowNum });
      toast(keep ? `Kept ${rowNum} in this cycle.` : `Dropped ${rowNum}. It goes back to the backlog when you approve the plan.`);
    } catch (err) { btn.disabled = false; toast("Couldn't save that (" + (err && err.code || "error") + ")."); }
  }

  async function sendPlanFeedback(cid, btn) {
    if (!db) return noDb();
    const key = `note-${cid}-planfb`;
    const text = (drafts[key] || "").trim();
    if (!text) return toast("Type your notes first.");
    const now = Date.now(); btn.disabled = true;
    let n = cid, rev = 0, dropped = [];
    try {
      const { ref, data } = await readDoc("cycles/" + cid); if (!data) return;
      n = data.number || cid; rev = (data.plan && data.plan.revision) || 0;
      dropped = (data.rows || []).filter((r) => r && r.keep === false).map((r) => r.num);
      data.feedback = (data.feedback || []).concat([{ t: now, by: "rider", text }]);
      data.steps = data.steps || {};
      data.steps.plan = Object.assign({}, data.steps.plan || {}, { status: "requested", mode: "revise", requestedAt: now, startedAt: null, finishedAt: null, note: text, requestedBy: uid || null, wake: null });
      await ref.set(data);
      await logBoard({ t: now, stage: "cycle " + n, event: "plan notes", text });
      drafts[key] = "";
    } catch (err) { btn.disabled = false; return toast("Couldn't save your notes (" + (err && err.code || "error") + "). Nothing was sent."); }
    const r = await wake($("card-" + cid + "-plan") || $("main"), `START plan — cycle ${n} · revise (revision ${rev + 1})\n\nRider notes:\n${text}\n\nDropped rows: ${dropped.join(", ") || "(none)"}\n\nRun the transitnav-pipeline skill for stage "plan" on cycles/${cid} in revise mode: read feedback[] and rows[].keep, post the next revision (plan.revision+1, plan.changes, steps.plan.summary), set steps.plan.status back to "draft", and reply here with what changed.`);
    await recordWake([cid], "plan", r);
    toast(r.ok ? `Notes sent. Claude is drafting revision ${rev + 1}.` : `Notes saved on the board, but ${r.why}.`, r.ok ? 4000 : 7000);
  }

  async function approvePlan(cid, btn) {
    if (!db) return noDb();
    const now = Date.now(); btn.disabled = true;
    let n = cid, rev = 0, dropped = [], kept = 0, skip = [];
    try {
      const { ref, data } = await readDoc("cycles/" + cid); if (!data) return;
      if (((data.steps || {}).plan || {}).status !== "draft") { btn.disabled = false; return toast("The plan is not waiting for review any more."); }
      n = data.number || cid; rev = (data.plan && data.plan.revision) || 0;
      dropped = (data.rows || []).filter((r) => r && r.keep === false).map((r) => r.num);
      kept = (data.rows || []).filter((r) => r && r.keep !== false).length;
      skip = (data.questions || []).filter((q) => q && !q.answer).flatMap((q) => q.rows || []);
      data.steps.plan = Object.assign({}, data.steps.plan, { status: "done", finishedAt: now });
      data.plan = Object.assign({}, data.plan || {}, { approvedAt: now, approvedBy: uid || null });
      // Approving is the build press: one decision, not two.
      data.steps.build = Object.assign({}, data.steps.build || {}, { status: "requested", requestedAt: now, startedAt: null, finishedAt: null, note: "", requestedBy: uid || null, wake: null });
      await ref.set(data);
      await logBoard({ t: now, stage: "cycle " + n, event: "plan approved · build requested", text: `revision ${rev} · ${kept} rows kept, ${dropped.length} dropped` });
    } catch (err) { btn.disabled = false; return toast("Couldn't approve (" + (err && err.code || "error") + ")."); }
    const r = await wake($("card-" + cid + "-plan") || $("main"), `PLAN APPROVED — cycle ${n} (revision ${rev}) · START build — cycle ${n}\nDropped rows: ${dropped.join(", ") || "(none)"}\nRows skipped (question open): ${skip.join(", ") || "(none)"}\n\nRecord the approval on the backlog's cycle plan section and move dropped rows back to the backlog's candidates. Then run the transitnav-pipeline skill for stage "build" on cycles/${cid} (already marked requested), update it, and reply here when it is done.`);
    await recordWake([cid], "build", r);
    toast(r.ok ? "Plan approved. Build is queued." : `Plan approved on the board, but ${r.why}. Tell Claude “check the pipeline board”.`, r.ok ? 4000 : 7000);
  }

  // ---- boot -------------------------------------------------------------
  PV.register("classic", () => render());
  render();
  setInterval(() => { if (!ui.item) render(); }, 60000); // keep "N min ago" honest
  (async () => {
    if (!window.claude || !window.claude.use) { render(); return; }
    const [d, c, u] = await PV.caps();
    db = d; comments = c; user = u;
    if (!db) { render(); return; }
    if (user) { try { uid = await user.id(); } catch (_) {} try { canEdit = await user.can("data.write"); } catch (_) { canEdit = null; } }
    connected = true;
    PV.watch("board", (ok, bad) => db.doc(BOARD).onSnapshot(ok, bad), (snap) => { board = snap.exists ? snap.data() : null; render(); }, (err) => { connected = false; render(); toast("Lost the board connection (" + err.code + "). Reload to reconnect."); });
    PV.watch("cycles", (ok, bad) => db.collection("cycles").onSnapshot(ok, bad), (qs) => { cycles = qs.docs.filter((x) => x.exists).map((x) => x.data()); render(); }, (err) => { connected = false; render(); toast("Lost the cycles feed (" + err.code + "). Reload to reconnect."); });
  })();
})();
</script>

<script>
(function () {
  "use strict";
  // Review copy: presses write only to this artifact's own database and nothing is sent to Claude.
  // For the live board set this to false and publish to the live board's URL.
  const REVIEW_COPY = false;
  const MONITOR = "https://rwtpc4.tail9d6464.ts.net:7443/";
  const TERMINALS = {};
  const loadTerminals = () => fetch("/api/terminals").then((r) => r.json()).then((t) => { const changed = JSON.stringify(t) !== JSON.stringify(TERMINALS); for (const k in TERMINALS) delete TERMINALS[k]; Object.assign(TERMINALS, t); if (changed) render(true); }).catch(() => {});
  loadTerminals(); setInterval(loadTerminals, 20000);
  const BOARD = "pipeline/board";
  const ORDER = ["plan", "build", "ship-dev", "verify", "ship-prod"];
  const LABEL = { plan: "Plan", build: "Build", "ship-dev": "Ship dev", verify: "Verify", "ship-prod": "Ship prod" };
  const PRED = { build: "plan", "ship-dev": "build", verify: "ship-dev", "ship-prod": "verify" };

  const $ = (id) => document.getElementById(id);
  const ROOT = $("pv-chat");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtD = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const fmtT = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });
  const when = (ms) => { if (!ms) return ""; const d = new Date(ms); return d.toDateString() === new Date().toDateString() ? fmtT.format(d) : fmtD.format(d); };

  let db = null, comments = null, uid = null, canEdit = null, connected = false;
  let board = null, cycles = [];
  const ui = { view: null, noTarget: {}, open: {} };
  try { ui.view = localStorage.getItem("pipeline-simple-view"); } catch (_) {}
  const drafts = {};

  // ---- derived (same rules as the tabbed board) -------------------------
  const stepOf = (c, k) => (c.steps && c.steps[k]) || { status: "idle" };
  const stat = (c, k) => stepOf(c, k).status || "idle";
  const busy = (s) => s === "requested" || s === "running";
  const branches = (c) => (c.branches || []).filter((b) => b && typeof b === "object");
  const isBuilt = (c, b) => !!(b && (b.sha || stat(c, "build") === "done"));
  const built = (c) => branches(c).filter((b) => isBuilt(c, b));
  const approved = (c) => built(c).filter((b) => b.decision === "approve");
  const undecided = (c) => built(c).filter((b) => b.shippable !== false && !b.decision);
  const ships = (c) => built(c).filter((b) => b.shippable !== false && b.decision !== "hold");
  const heldB = (c) => built(c).filter((b) => b.decision === "hold");
  const OUT = ["on-dev", "not-exercised", "pass", "fail", "closed", "in-prod"];
  const isOut = (c, b) => { const rs = (c.rows || []).filter((r) => (b.rows || []).includes(r.num)); if (rs.length) return rs.some((r) => OUT.includes(r.status)); const sd = stepOf(c, "ship-dev"); return sd.status === "done" && b.decision !== "hold" && !(b.decidedAt > (sd.finishedAt || 0)); };
  const unanswered = (c) => (c.questions || []).filter((q) => q && !q.answer);
  const planRev = (c) => (c.plan && c.plan.revision) || 0;
  const nextStep = (c) => { if (c.retiredAt) return null; for (const k of ORDER) if (stat(c, k) !== "done") return k; return null; };
  const liveCycles = () => cycles.filter((c) => !c.retiredAt).sort((a, z) => (a.number || 0) - (z.number || 0));
  const cyc = (id) => cycles.find((c) => c.id === id);
  const nextNumber = () => cycles.reduce((m, c) => Math.max(m, c.number || 0), 0) + 1;
  function gate(c, k) {
    const p = PRED[k];
    if (p && stat(c, p) !== "done") return { ok: false, why: `Waiting for ${LABEL[p]}` };
    return { ok: true, why: "" };
  }

  // Where a cycle is and what it waits on: {k: current phase, s: you|run|ride|ready|done|"", text}
  function where(c) {
    if (c.retiredAt) return { k: "ship-prod", s: "done", text: "In production" };
    for (const k of ORDER) if (busy(stat(c, k))) return { k, s: "run", text: stat(c, k) === "running" ? "Claude is on it" : "Sent, waiting for Claude to start" };
    if (stat(c, "plan") === "draft") return { k: "plan", s: "you", text: `Plan revision ${planRev(c)} waits on you` };
    for (const k of ORDER) if (stat(c, k) === "blocked") return { k, s: "you", text: `${LABEL[k]} stopped, needs you` };
    const k = nextStep(c);
    if (!k) return { k: "ship-prod", s: "done", text: "All steps done" };
    if (unanswered(c).length) return { k, s: "you", text: `${unanswered(c).length} question${unanswered(c).length === 1 ? "" : "s"} for you` };
    if (k === "build") return { k, s: "run", text: "Builds on its own" };
    if (k === "ship-dev") return { k, s: "run", text: "Ships to dev on its own" };
    if (k === "verify") return { k, s: "ride", text: "On dev · verifies on your next dev-app ride" };
    if (k === "ship-prod") {
      // Say what the ride actually showed, not just that Verify ran.
      const rs = (c.rows || []).filter((r) => r.keep !== false && r.branch);
      const pass = rs.filter((r) => ["pass", "closed"].includes(r.status)).length;
      const fail = rs.filter((r) => r.status === "fail").length;
      const wait = rs.filter((r) => ["on-dev", "not-exercised"].includes(r.status)).length;
      if (fail) return { k, s: "you", text: `${fail} failed on the ride · ${pass} passed` };
      if (wait) return { k, s: "ride", text: `${pass} passed · ${wait} not tried on a ride yet` };
      return { k, s: "ready", text: pass ? `All ${pass} passed on a ride` : "Verified" };
    }
    return gate(c, k).ok ? { k, s: "ready", text: `Ready to ${LABEL[k].toLowerCase()}` } : { k, s: "", text: gate(c, k).why };
  }

  const waitingOnRide = (c) => (c.rows || []).some((r) => r.keep !== false && ["on-dev", "not-exercised"].includes(r.status));
  // The one allowed next press for a cycle (same writes and gating as the tabbed board).
  function nextPress(c) {
    if (c.retiredAt) return null;
    if (ORDER.some((k) => busy(stat(c, k)))) return null;
    if (stat(c, "plan") === "draft") return { label: "Approve plan · build it", act: () => approvePlan(c.id) };
    for (const k of ORDER) if (stat(c, k) === "blocked") return { label: `Resume ${LABEL[k].toLowerCase()}`, act: () => requestStep(c.id, k) };
    const k = nextStep(c); if (!k) return null;
    // Build, ship-dev and verify all run on their own (verify on each trip that ends, since 2026-10-09):
    // no press for any of them.
    if (k === "build" || k === "ship-dev" || k === "verify") return null;
    const g = gate(c, k);
    const lbl = { plan: `Plan cycle ${c.number}`, "ship-prod": "Ship to prod" }[k];
    const p = { label: lbl, act: () => requestStep(c.id, k), disabled: !g.ok };
    return p;
  }

  // ---- conversation -----------------------------------------------------
  function thread(c) {
    const out = [];
    const add = (t, kind, who, text, extra) => { if (text) out.push(Object.assign({ t: t || c.createdAt || 0, kind, who, text }, extra || {})); };
    add(c.createdAt, "sys", "", `Cycle ${c.number} opened${c.title ? ": " + c.title : ""}`);
    for (const k of ORDER) {
      const st = stepOf(c, k);
      if (st.requestedAt && (busy(st.status) || st.finishedAt)) add(st.requestedAt, "sys", "", `${LABEL[k]} requested${st.note ? ": " + st.note : ""}`);
      if (st.startedAt && st.status === "running") add(st.startedAt, "sys", "", `${LABEL[k]} started`);
      const sum = k === "plan" ? [c.plan && c.plan.changes ? "What changed: " + c.plan.changes : "", st.summary].filter(Boolean).join("\n\n") : st.summary;

  async function recordWake(id, key, r) {
    try { const { ref, data } = await readDoc("cycles/" + id); if (data && data.steps && data.steps[key]) { data.steps[key].wake = { ok: r.ok, at: Date.now(), why: r.why || "" }; await ref.set(data); } } catch (_) {}
  }

  async function requestIntake(note) {
    if (!db) return noDb();
    note = (note || "").trim(); const now = Date.now(); const n = nextNumber();
    try {
      const { ref, data } = await readDoc(BOARD); const b = data || {};
      b.intake = Object.assign({}, b.intake || {}, { status: "requested", requestedAt: now, startedAt: null, finishedAt: null, note, requestedBy: uid || null, wake: null, thenPlan: false });
      appendLog(b, { t: now, stage: "triage", event: "requested", text: (note ? note + " · " : "") + "triage only" }); b.updatedAt = now; await ref.set(b);
    } catch (err) { render(true); toast("Couldn't write the request (" + (err && err.code || "error") + "). Nothing was queued."); return false; }
    const r = await wake(`START triage` + (note ? `\n\n${note}` : "") + `\n\nRun the transitnav-pipeline skill for stage "triage" and update pipeline/board.intake. Do not open a cycle or plan; leave the rows for the rider to approve.`);
    try { const { ref, data } = await readDoc(BOARD); if (data && data.intake) { data.intake.wake = { ok: r.ok, at: Date.now(), why: r.why || "" }; await ref.set(data); } } catch (_) {}
    toast(sentMsg(r, "Sent. Triage is queued; you approve its rows before any plan."));
    return true;
  }

  async function requestStep(cid, key) {
    if (!db) return noDb();
    const now = Date.now();
    try {
      const { ref, data } = await readDoc("cycles/" + cid); if (!data) return false;
      data.steps = data.steps || {}; data.steps[key] = Object.assign({}, data.steps[key] || {}, { status: "requested", requestedAt: now, startedAt: null, finishedAt: null, note: "", requestedBy: uid || null, wake: null });
      await ref.set(data);
      await logBoard({ t: now, stage: "cycle " + (data.number || cid), event: key + " requested", text: "" });
    } catch (err) { render(true); toast("Couldn't write the request (" + (err && err.code || "error") + "). Nothing was queued."); return false; }
    const c0 = cyc(cid) || {}; const n = c0.number || cid;
    const text = key === "verify"
      ? `START verify — cycle ${n} (last ride)\n\nRun the transitnav-pipeline skill for stage "verify" on cycles/${cid} ONLY — score this cycle's rows against the last dev ride, touch no other cycle, update it, and reply here when done.`
      : key === "ship-dev"
        ? `START ship-dev — cycle ${n}\nApproved: ${ships(c0).map((b) => b.name).join(", ") || "(none)"}\nHeld: ${heldB(c0).map((b) => b.name).join(", ") || "(none)"}\n\nRun the transitnav-pipeline skill for stage "ship-dev" on cycles/${cid}: merge every built branch that is not held, update it, and reply here when it is done.`
        : `START ${key} — cycle ${n}\n\nRun the transitnav-pipeline skill for stage "${key}" on cycles/${cid}, update it, and reply here when it is done.`;
    const r = await wake(text);
    await recordWake(cid, key, r);
    toast(sentMsg(r, `Sent. ${LABEL[key]} is queued.`));
    return true;
  }

  async function approvePlan(cid) {
    if (!db) return noDb();
    const now = Date.now(); let n = cid, rev = 0, dropped = [], kept = 0, skip = [];
    try {
      const { ref, data } = await readDoc("cycles/" + cid); if (!data) return false;
      if (((data.steps || {}).plan || {}).status !== "draft") { render(true); toast("The plan is not waiting for review any more."); return false; }
      n = data.number || cid; rev = (data.plan && data.plan.revision) || 0;
      dropped = (data.rows || []).filter((r) => r && r.keep === false).map((r) => r.num);
      kept = (data.rows || []).filter((r) => r && r.keep !== false).length;
      skip = (data.questions || []).filter((q) => q && !q.answer).flatMap((q) => q.rows || []);
      data.steps.plan = Object.assign({}, data.steps.plan, { status: "done", finishedAt: now });
      data.plan = Object.assign({}, data.plan || {}, { approvedAt: now, approvedBy: uid || null });
      data.steps.build = Object.assign({}, data.steps.build || {}, { status: "requested", requestedAt: now, startedAt: null, finishedAt: null, note: "", requestedBy: uid || null, wake: null });
      await ref.set(data);
      await logBoard({ t: now, stage: "cycle " + n, event: "plan approved · build requested", text: `revision ${rev} · ${kept} rows kept, ${dropped.length} dropped` });
    } catch (err) { render(true); toast("Couldn't approve (" + (err && err.code || "error") + ")."); return false; }
    const r = await wake(`PLAN APPROVED — cycle ${n} (revision ${rev}) · START build — cycle ${n}\nDropped rows: ${dropped.join(", ") || "(none)"}\nRows skipped (question open): ${skip.join(", ") || "(none)"}\n\nRecord the approval on the backlog's cycle plan section and move dropped rows back to the backlog's candidates. Then run the transitnav-pipeline skill for stage "build" on cycles/${cid} (already marked requested), update it, and reply here when it is done.`);
    await recordWake(cid, "build", r);
    toast(sentMsg(r, "Plan approved. Build is queued."));
    return true;
  }

  async function sendPlanFeedback(cid, text) {
    if (!db) return noDb();
    const now = Date.now(); let n = cid, rev = 0, dropped = [];
    try {
      const { ref, data } = await readDoc("cycles/" + cid); if (!data) return false;
      n = data.number || cid; rev = (data.plan && data.plan.revision) || 0;
      dropped = (data.rows || []).filter((r) => r && r.keep === false).map((r) => r.num);
      data.feedback = (data.feedback || []).concat([{ t: now, by: "rider", text }]);
      data.steps = data.steps || {};
      data.steps.plan = Object.assign({}, data.steps.plan || {}, { status: "requested", mode: "revise", requestedAt: now, startedAt: null, finishedAt: null, note: text, requestedBy: uid || null, wake: null });
      await ref.set(data);
      await logBoard({ t: now, stage: "cycle " + n, event: "plan notes", text });
    } catch (err) { toast("Couldn't save your notes (" + (err && err.code || "error") + "). Nothing was sent."); return false; }
    const r = await wake(`START plan — cycle ${n} · revise (revision ${rev + 1})\n\nRider notes:\n${text}\n\nDropped rows: ${dropped.join(", ") || "(none)"}\n\nRun the transitnav-pipeline skill for stage "plan" on cycles/${cid} in revise mode: read feedback[] and rows[].keep, post the next revision (plan.revision+1, plan.changes, steps.plan.summary), set steps.plan.status back to "draft", and reply here with what changed.`);
    await recordWake(cid, "plan", r);
    toast(sentMsg(r, `Sent. Claude is drafting revision ${rev + 1}.`));
    return true;
  }

  async function sendAnswer(cid, qid, a) {
    if (!db) return noDb();
    const now = Date.now(); let inReview = false, rev = 0, q0 = null, n = cid;
    try {
      const { ref, data } = await readDoc("cycles/" + cid); if (!data) return false;
      n = data.number || cid;
      data.questions = (data.questions || []).map((q) => { if (q && q.id === qid && !q.answer) { q0 = q; return Object.assign({}, q, { answer: a, answeredAt: now }); } return q; });
      if (!q0) { toast("That question is already answered."); render(true); return false; }
      if (((data.steps || {}).plan || {}).status === "draft") { inReview = true; rev = (data.plan && data.plan.revision) || 0; data.steps.plan = Object.assign({}, data.steps.plan, { status: "requested", mode: "revise", requestedAt: now, startedAt: null, finishedAt: null, requestedBy: uid || null, wake: null }); }
      await ref.set(data);
      await logBoard({ t: now, stage: "cycle " + n, event: "answers", text: qid.toUpperCase() + ": " + a });
    } catch (err) { toast("Couldn't save the answer (" + (err && err.code || "error") + ")."); return false; }
    const r = await wake(`ANSWERS — cycle ${n}\n${qid.toUpperCase()} (${(q0.rows || []).join(", ")}): ${a}` + (inReview ? `\n\nThe plan is in review (revision ${rev}): record these answers on their rows and post the next plan revision, then reply here with what changed.` : `\n\nRecord these on the rows they affect; if Build is running for this cycle, add the unblocked rows to it.`));
    if (inReview) await recordWake(cid, "plan", r);
    toast(sentMsg(r, "Answer saved and sent."));
    return true;
  }

  // New: a plain message to the cycle's agent. Saved in feedback[]; the router forwards any comment naming "cycle N".
  async function sendMessage(cid, text) {
    if (!db) return noDb();
    const now = Date.now(); let n = cid;
    try {
      const { ref, data } = await readDoc("cycles/" + cid); if (!data) return false;
      n = data.number || cid;
      data.feedback = (data.feedback || []).concat([{ t: now, by: "rider", text }]);
      await ref.set(data);
      await logBoard({ t: now, stage: "cycle " + n, event: "message", text });
    } catch (err) { toast("Couldn't save the message (" + (err && err.code || "error") + "). Nothing was sent."); return false; }
    const r = await wake(`MESSAGE — cycle ${n} (msg ${now})\n\n${text}\n\nThe rider wrote this in cycle ${n}'s chat on the board; it is saved in cycles/${cid} feedback[]. Answer by appending {t, by: "claude", text} to that feedback[], and act on it only within cycle ${n}.`);
    toast(sentMsg(r, `Sent to cycle ${n}.`));
    return true;
  }

  async function decideBranch(cid, name, decision, btn) {
    if (!db) return noDb();
    const now = Date.now(); btn.disabled = true;
    try {
      const { ref, data } = await readDoc("cycles/" + cid); if (!data) return;
      let hit = false;
      data.branches = (data.branches || []).map((b) => { if (b && typeof b === "object" && b.name === name) { hit = true; return Object.assign({}, b, { decision, decidedAt: now, decidedBy: uid || null }); } return b; });
      if (!hit) { btn.disabled = false; return toast("That branch is no longer on the cycle."); }
      await ref.set(data);
      await logBoard({ t: now, stage: "cycle " + (data.number || cid), event: decision === "approve" ? "set to ship" : "held", text: name });
    } catch (err) { btn.disabled = false; toast("Couldn't save the decision (" + (err && err.code || "error") + ")."); }
  }

  // ---- boot -------------------------------------------------------------
  PV.register("chat", () => render(false));
  render(false);
  setInterval(() => render(true), 60000);
  window.addEventListener("resize", () => render(true)); // the terminal's font is sized to the width
  (async () => {
    if (!window.claude || !window.claude.use) return;
    const [d, c0, u] = await PV.caps(); const c = REVIEW_COPY ? null : c0;
    db = d; comments = c;
    if (!db) return;
    if (u) { try { uid = await u.id(); } catch (_) {} try { canEdit = await u.can("data.write"); } catch (_) { canEdit = null; } }
    connected = true;
    let first = true;
    const again = () => { render(!first); first = false; };
    PV.watch("board", (ok, bad) => db.doc(BOARD).onSnapshot(ok, bad), (snap) => { board = snap.exists ? snap.data() : null; again(); }, (err) => { connected = false; render(true); toast("Lost the board connection (" + err.code + "). Reload to reconnect."); });
    PV.watch("cycles", (ok, bad) => db.collection("cycles").onSnapshot(ok, bad), (qs) => { cycles = qs.docs.filter((x) => x.exists).map((x) => x.data()); again(); }, (err) => { connected = false; render(true); toast("Lost the cycles feed (" + err.code + "). Reload to reconnect."); });
  })();
})();
</script>

<script>
(function () {
  const vv = window.visualViewport; if (!vv) return;
  const fit = () => {
    const chat = document.getElementById("pv-chat"), bar = document.getElementById("pv-bar");
    if (document.body.dataset.pv !== "chat") { chat.style.height = ""; return; }
    const barH = bar && getComputedStyle(bar).display !== "none" ? bar.offsetHeight : 0;
    chat.style.height = Math.max(200, vv.height - barH) + "px";
    window.scrollTo(0, 0);
  };
  vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit); window.addEventListener("resize", fit);
  document.addEventListener("click", (e) => { if (e.target.closest("[data-pv]")) setTimeout(fit, 0); });
  fit();
})();
</script>
</body></html>
