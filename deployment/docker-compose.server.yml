# Server-side compose: OTP only.
#
# Differs from docker/docker-compose.yml in three ways, each load-bearing:
#   1. Dockerfile.runtime — the prebuilt JAR, no Maven build on a 4 GB box.
#   2. JAVA_OPTS heap — the repo's -Xmx4G is what makes the memory budget not
#      fit. It was -Xmx2G until 2026-09-17, when the measured peak of 1.99 GiB
#      turned out to be the ceiling and not the budget: after 14.1 shipped a
#      per-request maxStopCount of 10000 (2026-09-13), the FOREGROUND search's
#      three concurrent plans — fired twice ~0.8 s apart, so six at once —
#      threw `OutOfMemoryError: Java heap space` twice during the 09-15 15:46
#      ride (20:50:00.518Z, 20:53:10.297Z) and stalled the whole JVM for 27.8 s.
#      Reproduced on this box: x5 concurrent at cap 10000 = 120 s wall with 4
#      of 5 OOM, against 11.5 s and healthy at cap 2000.
#      2560m, not more: java is 2340 MB RSS of 3915 MB total with 1027 MB
#      available and 1123 MB of page cache holding the 452 MB graph, so +512 MB
#      leaves ~500 MB of slack; -Xmx2816m would invite the host OOM-killer.
#      The GC log goes to stdout because /var/opentripplanner is mounted :ro.
#      This buys headroom and makes the next event measurable; it is NOT the
#      fix. The fix is the client bounding concurrent cap-bearing plans
#      (backlog 17.8, otprr). Do not raise --maxThreads: the 4-thread pool this
#      box computes from 2 vCPUs is currently the only thing bounding the
#      damage.
#   3. No nominatim-proxy (wired to nothing), no frontend-dev (the phone runs a
#      bundled build and nginx serves the static one), no Pelias — geocoding
#      goes to Stadia. Those three are why 4 GB is enough.
#
# The graph is built on the desktop and rsynced in; this only ever --loads it.
services:
  otp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runtime
    image: docker-otp
    container_name: otp-minneapolis
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ../data:/var/opentripplanner:ro
      - ../config:/etc/otp:ro
    environment:
      - JAVA_OPTS=-Xmx2560m -Xlog:gc:stdout:time,uptime,level,tags
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/otp/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
