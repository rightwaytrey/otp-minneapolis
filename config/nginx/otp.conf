server {
    listen 9966 ssl http2;
    server_name tre.hopto.org;

    # --- Access control: whole site locked; only credentialed users get in. ---
    # Add users later with:  sudo htpasswd /etc/nginx/.htpasswd <name>   (no -c)
    auth_basic           "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # SSL certificate paths
    ssl_certificate /etc/letsencrypt/live/tre.hopto.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tre.hopto.org/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Proxy OTP API to backend on port 8090
    location /otp {
        proxy_pass http://localhost:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Natural-language routing-preferences API (Flask on 127.0.0.1:8092).
    # Inherits the server-level auth_basic above; same-origin, so no CORS needed.
    location /api/preferences {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 4k;
    }

    # Proxy Geocoder API to avoid CORS issues
    # PhotonGeocoder sends requests to /photon/api (baseUrl + "/api")
    # Use variable-based proxy_pass to avoid DNS resolution at startup
    location /photon/api {
        resolver 127.0.0.53 valid=300s;
        resolver_timeout 5s;
        set $photon_upstream https://photon.komoot.io;
        proxy_pass $photon_upstream/api$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host photon.komoot.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

        # Handle preflight
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Proxy Pelias Geocoder API
    location /pelias/ {
        rewrite ^/pelias/(.*)$ /$1 break;
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Group Delivery API - proxy to FastAPI backend on port 8000
    location /delivery/api {
        rewrite ^/delivery/api/(.*)$ /api/$1 break;
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

        # Handle preflight
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }


    # Proxy frontend to port 9967
    location / {
        proxy_pass http://localhost:9967;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
