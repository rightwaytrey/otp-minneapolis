# --- Cookie-based access gate ---------------------------------------------
# If the visitor presents the long-lived "otp_access" cookie with the correct
# secret, auth_basic is set to "off" (the literal string disables it) and the
# site opens with no password prompt. Otherwise it falls back to the realm
# name "Restricted", which triggers the normal HTTP Basic Auth prompt.
# Set the cookie once per device by visiting:  /unlock?key=<SECRET>
# NOTE: the long cookie value needs map_hash_bucket_size 128, set globally in
# conf.d/00-map-hash.conf (it must be parsed before any map block, and another
# site already defines one).
#
# Tailnet bypass: the phone reaches this box over Tailscale (split DNS sends
# tre.hopto.org -> 100.72.153.99 whenever Tailscale is on — required anyway
# because the home WiFi isolates clients). Requests sourced from the tailnet
# (100.64.0.0/10, only this user's devices) are already authenticated by
# Tailscale itself, so the gate is waived for them. This is the safety net
# that keeps the native app working even if iOS ever clears the WebView's
# cookie store mid-trip. The cookie remains the fallback for the public path
# (Tailscale off + cellular).
geo $otp_from_tailnet {
    default        0;
    100.64.0.0/10  1;
}
map $cookie_otp_access $otp_realm_by_cookie {
    "6cc7b5452b70af9646e7b12747d3a99b72680126dd4f8880"  off;
    default                                             "Restricted";
}
map $otp_from_tailnet $otp_auth_realm {
    1        off;
    default  $otp_realm_by_cookie;
}

# --- Public API rate limits -------------------------------------------------
# The API routes below are open to the internet (the native app runs from a
# capacitor://localhost origin, so it can't ride the site's cookie gate). These
# zones keep a single IP from hammering the home connection. The web UI at /
# stays behind the auth gate.
limit_req_zone $binary_remote_addr zone=otp_api:10m rate=10r/s;   # /otp, /pelias
limit_req_zone $binary_remote_addr zone=otp_ai:1m   rate=30r/m;   # /api/preferences (Flask enforces 5/min on top)
limit_req_zone $binary_remote_addr zone=otp_log:1m  rate=2r/s;    # /api/debug-log (client flushes every ~3s)

server {
    listen 9966 ssl http2;
    server_name tre.hopto.org;

    # --- Access control: whole site locked; only credentialed users get in. ---
    # Cookie holders skip the prompt (see map above); everyone else gets Basic Auth.
    # Add password users with:  sudo htpasswd /etc/nginx/.htpasswd <name>   (no -c)
    auth_basic           $otp_auth_realm;
    auth_basic_user_file /etc/nginx/.htpasswd;

    # SSL certificate paths
    ssl_certificate /etc/letsencrypt/live/tre.hopto.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tre.hopto.org/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # One-time unlock: visit /unlock?key=<SECRET> to drop a 1-year access cookie,
    # then get redirected to the app. Reachable without Basic Auth, but requires
    # knowing the secret key. After this, the device never sees a login prompt.
    location = /unlock {
        auth_basic off;
        if ($arg_key != "6cc7b5452b70af9646e7b12747d3a99b72680126dd4f8880") {
            return 403;
        }
        add_header Set-Cookie "otp_access=6cc7b5452b70af9646e7b12747d3a99b72680126dd4f8880; Path=/; Max-Age=31536000; Secure; HttpOnly; SameSite=Lax";
        return 302 /;
    }

    # Optional: clear the cookie (re-locks this device, forcing Basic Auth again).
    location = /lock {
        auth_basic off;
        add_header Set-Cookie "otp_access=; Path=/; Max-Age=0";
        return 302 /;
    }

    # Proxy OTP API to backend on port 8090.
    # PUBLIC (rate-limited): the native app calls this cross-origin from
    # capacitor://localhost, where no cookie/Basic-Auth can ride along. Trip
    # planning is public transit data. OTP2 emits its own CORS headers (echoes
    # the Origin, handles OPTIONS preflight) — do NOT add_header ACAO here or
    # browsers will reject the duplicate.
    location /otp {
        auth_basic off;
        limit_req zone=otp_api burst=30 nodelay;

        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Natural-language routing-preferences API (Flask on 127.0.0.1:8092).
    # PUBLIC (rate-limited): Flask enforces its own 5/min/IP limit and owns the
    # CORS headers (flask-cors) — no ACAO here or browsers reject the duplicate.
    location /api/preferences {
        auth_basic off;
        limit_req zone=otp_ai burst=5 nodelay;

        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 4k;
    }

    # Go Mode push relay -> Pushover (same Flask service on 127.0.0.1:8092).
    location /api/go-notify {
        auth_basic off;
        limit_except OPTIONS {
            auth_basic           $otp_auth_realm;
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 2k;
    }

    # Go Mode debug-log sink -> Flask (127.0.0.1:8092) -> JSONL on disk. The
    # frontend streams its Redux action log + JS errors here for diagnosis.
    # Batches are larger than a push, so allow a roomier body.
    # PUBLIC (rate-limited): testers' native apps report here cross-origin;
    # Flask owns the CORS headers.
    location /api/debug-log {
        auth_basic off;
        limit_req zone=otp_log burst=20 nodelay;

        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 512k;
    }

    # Proxy Geocoder API to avoid CORS issues
    # PhotonGeocoder sends requests to /photon/api (baseUrl + "/api")
    # Use variable-based proxy_pass to avoid DNS resolution at startup
    location /photon/api {
        auth_basic off;
        limit_except OPTIONS {
            auth_basic           $otp_auth_realm;
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        resolver 127.0.0.53 valid=300s;
        resolver_timeout 5s;
        set $photon_upstream https://photon.komoot.io;
        proxy_pass $photon_upstream/api$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host photon.komoot.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

        # Handle preflight
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Proxy Pelias Geocoder API.
    # The frontend (baseUrl: /pelias/v1) requests /pelias/v1/autocomplete etc.
    # A trailing-slash proxy_pass strips the matched "/pelias/" prefix and forwards
    # "/v1/autocomplete" to pelias-api. (A bare "rewrite ... ; proxy_pass http://host;"
    # is silently IGNORED by nginx, which is why this used to 404 with /pelias/ intact.)
    # 127.0.0.1, not "localhost": the backend is IPv4-only.
    # PUBLIC (rate-limited): geocoding for the native app, cross-origin. Pelias
    # emits its own CORS headers (ACAO *, handles OPTIONS) — the add_header trio
    # that used to live here would DUPLICATE them on proxied responses and make
    # browsers reject the response, so CORS is left entirely to the upstream.
    location /pelias/ {
        auth_basic off;
        limit_req zone=otp_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Group Delivery API - proxy to FastAPI backend on port 8000
    location /delivery/api {
        auth_basic off;
        limit_except OPTIONS {
            auth_basic           $otp_auth_realm;
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        rewrite ^/delivery/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

        # Handle preflight
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }


    # Serve the STATIC production build (no HMR, no websocket, nothing that can
    # reload the app out from under a live trip). Rebuild + redeploy with
    # frontend/deploy-prod.sh. The app uses hash routing, so every route is "/"
    # and try_files falls back to index.html. The dev server on :9967 stays up
    # for development but is no longer in the serving path.
    #
    # Caching: without an explicit Cache-Control, the iOS WebView heuristically
    # caches index.html and keeps loading a STALE bundle after a deploy (seen
    # 2026-07-11: phone ran a day-old build hours after two deploys). The entry
    # document must always revalidate; the content-hashed assets under it are
    # immutable and can cache forever.
    location = /index.html {
        root /var/www/transitnav;
        add_header Cache-Control "no-cache";
    }
    location / {
        root /var/www/transitnav;
        try_files $uri /index.html;
    }
}
