# --- Cookie-based access gate ---------------------------------------------
# If the visitor presents the long-lived "otp_access" cookie with the correct
# secret, auth_basic is set to "off" (the literal string disables it) and the
# site opens with no password prompt. Otherwise it falls back to the realm
# name "Restricted", which triggers the normal HTTP Basic Auth prompt.
# Set the cookie once per device by visiting:  /unlock?key=<SECRET>
# NOTE: the long cookie value needs map_hash_bucket_size 128, set globally in
# conf.d/00-map-hash.conf (it must be parsed before any map block, and another
# site already defines one).
#
# Tailnet bypass: the phone reaches this box over Tailscale (split DNS sends
# tre.hopto.org -> 100.72.153.99 whenever Tailscale is on — required anyway
# because the home WiFi isolates clients). Requests sourced from the tailnet
# (100.64.0.0/10, only this user's devices) are already authenticated by
# Tailscale itself, so the gate is waived for them. This is the safety net
# that keeps the native app working even if iOS ever clears the WebView's
# cookie store mid-trip. The cookie remains the fallback for the public path
# (Tailscale off + cellular).
geo $otp_from_tailnet {
    default        0;
    100.64.0.0/10  1;
}
map $cookie_otp_access $otp_realm_by_cookie {
    "6cc7b5452b70af9646e7b12747d3a99b72680126dd4f8880"  off;
    default                                             "Restricted";
}
map $otp_from_tailnet $otp_auth_realm {
    1        off;
    default  $otp_realm_by_cookie;
}

# --- Public API rate limits -------------------------------------------------
# The API routes below are open to the internet (the native app runs from a
# capacitor://localhost origin, so it can't ride the site's cookie gate). These
# zones keep a single IP from hammering the home connection. The web UI at /
# stays behind the auth gate.
limit_req_zone $binary_remote_addr zone=otp_api:10m rate=10r/s;   # /otp, /pelias
limit_req_zone $binary_remote_addr zone=otp_ai:1m   rate=30r/m;   # /api/preferences (Flask enforces 5/min on top)
limit_req_zone $binary_remote_addr zone=otp_log:1m  rate=2r/s;    # /api/debug-log (client flushes every ~3s)


# --- TLS: two names, two certs, one shared body -----------------------------
# Both server blocks serve the identical site (config/nginx/otp-common.conf);
# they differ ONLY in server_name and which certificate they present. SNI picks.
#
#   tre.hopto.org             -> Let's Encrypt via certbot (HTTP-01 on port 80).
#                                Renewal REQUIRES inbound :80 from the public
#                                internet; when the router's port-forward is
#                                missing, certbot fails every run and the cert
#                                silently expires (it did on 2026-08-09, which
#                                broke address search and trip planning both).
#
#   rwtpc4.tail9d6464.ts.net  -> cert issued by Tailscale ("tailscale cert").
#                                No inbound ports, no router, no ISP dependency
#                                — the tailnet IS the transport. This is the
#                                path the phone actually uses (split DNS + the
#                                tailnet auth bypass above), so it stays valid
#                                even when the public path is down.
#                                Refreshed by scripts/renew-tailscale-cert.sh.

server {
    listen 9966 ssl http2;
    server_name tre.hopto.org;

    # SSL certificate paths
    ssl_certificate /etc/letsencrypt/live/tre.hopto.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tre.hopto.org/privkey.pem;

    include /etc/nginx/snippets/otp-common.conf;
}

server {
    listen 9966 ssl http2;
    server_name rwtpc4.tail9d6464.ts.net;

    # Written by scripts/renew-tailscale-cert.sh (tailscale cert ...).
    ssl_certificate /etc/nginx/certs/rwtpc4.tail9d6464.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/rwtpc4.tail9d6464.ts.net.key;

    include /etc/nginx/snippets/otp-common.conf;
}
